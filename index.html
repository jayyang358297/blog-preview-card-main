<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <title>Frontend Mentor | Blog preview card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Outfit:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css"></head>
</head>
<body>
  <div class="blogcard">
    <img class="blogcard__img" src="assets/images/illustration-article.svg" alt="Article illustration">
    <p class="blogcard__type">Learning</p>
    <p class="blogcard__date">Published 21 Dec 2023</p>
    <h1 class="blogcard__title">HTML & CSS foundations</h1>
    <p class="blogcard__description">These languages are the backbone of every <br> website, defining structure, content, and <br> presentation.</p>
    <p class="blogcard__author"><img class="blogcard__author_img" src="assets/images/image-avatar.webp" alt="Author avatar"><span class="blogcard__author_name">Greg Hopper</span></p>
  </div>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="https://www.frontendmentor.io/profile/jayyang358297">Jaywalk</a>.
  </footer>
</body>
</html>
